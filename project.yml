# project.yml — fonte de verdade do projeto Xcode (gerado via `xcodegen generate`).
# O .xcodeproj é derivado deste arquivo (mesmo padrão dos outros apps do Alexandre:
# Quando Vence, Estante — spec seção 4/18). App "I See Life": câmera de fotografia
# de rua, local-first, 100% offline (spec seção 0.5), duas experiências (Modo Rua /
# Modo Pro) e 4 receitas de cor aplicadas em tempo real.
#
# Codinome técnico do target/pasta/bundle: "ISeeLife".
name: ISeeLife

options:
  bundleIdPrefix: com.dablab              # prefixo confirmado, mesmo dos outros apps (spec 4)
  deploymentTarget:
    iOS: "17.0"                           # SwiftData exige iOS 17+ (spec seção 4)
  developmentLanguage: pt-BR              # idioma base; en adicionado via .lproj (spec 17)
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: XGZW6Y6K25          # team de assinatura reaproveitado (spec 4)
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # #Predicate/consultas SwiftData geram warnings de concorrência (código da Apple);
    # mantém em minimal, mesmo racional dos outros apps.
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  # ---------------------------------------------------------------------------
  # App principal (SwiftUI + SwiftData + AVFoundation + Core Image + StoreKit 2).
  # Somente iPhone e somente retrato — decisões explícitas (spec 3/17).
  # ---------------------------------------------------------------------------
  ISeeLife:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dablab.iseelife
        INFOPLIST_FILE: Sources/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"        # SOMENTE iPhone (spec 3/17)
        SUPPORTS_MACCATALYST: NO           # iOS-only (spec 3)

schemes:
  ISeeLife:
    build:
      targets:
        ISeeLife: all
    run:
      config: Debug
      # StoreKit config local para testar o Paywall/compra em sandbox (spec 8.7/26).
      storeKitConfiguration: ISeeLife.storekit
