# project.yml — fonte de verdade do projeto Xcode (gerado via `xcodegen generate`).
# O .xcodeproj é derivado deste arquivo (mesmo padrão dos outros apps do Alexandre:
# Quando Vence, Estante — spec seção 4/18). App "I See Life": câmera de fotografia
# de rua, local-first, 100% offline (spec seção 0.5), duas experiências (Modo Rua /
# Modo Pro) e receitas de cor aplicadas em tempo real.
#
# Codinome técnico do target/pasta/bundle: "ISeeLife".
name: ISeeLife

options:
  bundleIdPrefix: com.dablab              # prefixo confirmado, mesmo dos outros apps (spec 4)
  deploymentTarget:
    iOS: "17.0"                           # SwiftData exige iOS 17+ (spec seção 4)
  developmentLanguage: pt-BR              # idioma base; en adicionado via .lproj (spec 17)
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: XGZW6Y6K25          # team de assinatura reaproveitado (spec 4)
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.4.0"            # 1.4 = foto respeita a orientacao do aparelho (preview segue em retrato)
    CURRENT_PROJECT_VERSION: "15"         # build 15: so a foto segue a orientacao do aparelho (UI de volta em retrato)
    CODE_SIGN_STYLE: Automatic
    # #Predicate/consultas SwiftData geram warnings de concorrência (código da Apple);
    # mantém em minimal, mesmo racional dos outros apps.
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  # ---------------------------------------------------------------------------
  # App principal (SwiftUI + SwiftData + AVFoundation + Core Image + StoreKit 2).
  # Somente iPhone e somente retrato — decisões explícitas (spec 3/17).
  # ---------------------------------------------------------------------------
  ISeeLife:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "**/.DS_Store"
          - "Controls"                    # a extensão de Control é target próprio (iOS 18)
          - "Capture"                     # a extensão de captura da Tela de Bloqueio é target próprio (iOS 18)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dablab.iseelife
        INFOPLIST_FILE: Sources/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"        # SOMENTE iPhone (spec 3/17)
        SUPPORTS_MACCATALYST: NO           # iOS-only (spec 3)
    dependencies:
      - target: ISeeLifeControls          # embute a extensão de Control no app
        embed: true
      - target: ISeeLifeCapture           # embute a extensão de captura da Tela de Bloqueio
        embed: true

  # ---------------------------------------------------------------------------
  # Extensão de Control (Central de Controle / Tela de Bloqueio) — WidgetKit.
  # SOMENTE iOS 18+ (API ControlWidget). O app principal segue iOS 17; o Control
  # só aparece para quem está no iOS 18+ (igual Moment/LUX). Feature aditiva.
  # ---------------------------------------------------------------------------
  ISeeLifeControls:
    type: app-extension
    platform: iOS
    deploymentTarget:
      iOS: "18.0"
    sources:
      - path: Sources/Controls
        excludes:
          - "**/.DS_Store"
      - path: Sources/Shared           # AppIntent compartilhado com o app (openAppWhenRun)
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dablab.iseelife.controls
        INFOPLIST_FILE: Sources/Controls/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"   # ControlWidget exige iOS 18 (base do projeto é 17)

  # ---------------------------------------------------------------------------
  # Extensão de captura da Tela de Bloqueio (LockedCameraCapture) — SOMENTE iOS 18+.
  # É a PRESENÇA desta extensão que faz o app aparecer como câmera na Central de
  # Controle / Tela de Bloqueio / Botão de Ação. Nível A: só abre o app (Modo Rua).
  # ---------------------------------------------------------------------------
  ISeeLifeCapture:
    type: extensionkit-extension        # ExtensionKit (vai em Extensions/, NÃO PlugIns/) — exigido pelo ponto com.apple.securecapture
    platform: iOS
    deploymentTarget:
      iOS: "18.0"
    sources:
      - path: Sources/Capture
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dablab.iseelife.capture
        INFOPLIST_FILE: Sources/Capture/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"   # LockedCameraCapture exige iOS 18 (base do projeto é 17)
    dependencies:
      - sdk: LockedCameraCapture.framework

schemes:
  ISeeLife:
    build:
      targets:
        ISeeLife: all
        ISeeLifeControls: all
        ISeeLifeCapture: all
    run:
      config: Debug
      # StoreKit config local para testar o Paywall/compra em sandbox (spec 8.7/26).
      storeKitConfiguration: ISeeLife.storekit
